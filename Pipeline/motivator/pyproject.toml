[project]
name = "motivator"
version = "0.1.0"
description = "Simple motivational CLI used for DevOps pipeline training"
requires-python = ">=3.13"
dependencies = [
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
motivate-me = "motivator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
